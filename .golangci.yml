version: "2"

formatters:
  enable:
    - gofumpt
    - gci

linters:
  default: standard
  enable:
    - revive
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - perfsprint
    - unconvert
    - usestdlibvars
  exclusions:
    rules:
      # generate.go dispatches embeds via
      # reflect.MethodByName(cases.Title(...).String(plugin)), so the
      # "html" mimetype must resolve to the literal method name Html.
      # Renaming to HTML breaks that dispatch.
      - path: generate.go
        linters: [revive]
        text: "method Html should be HTML"
      # ZasData/ZasSiteData predate the cmd/library split and are public
      # API; renaming to Data/SiteData is a breaking change out of scope
      # here.
      - path: data.go
        linters: [revive]
        text: "stutters"
